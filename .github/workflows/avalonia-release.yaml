# Build and package (Inno Setup) the WinNutCPlus installer, once per architecture, on a version
# tag push, then attach both to the GitHub release for that tag. Tag and release creation/editing
# (title, notes, draft/prerelease status) stay manual — this only uploads the .exe files as
# release assets, creating a draft release if one doesn't already exist for the tag, without
# touching notes. WinNutCPlus.Core.Update.UpdateChecker looks for a release asset whose name ends
# in ".exe" and contains the running process's architecture ("x64"/"arm64").

name: avalonia-release

on:
  push:
    tags: "v*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get-ver
        run: ../.github/workflows/get-ver.ps1 ${{ github.ref }}
        working-directory: WinNUT.Avalonia
        shell: pwsh

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore, build, test
        working-directory: WinNUT.Avalonia
        run: |
          dotnet restore WinNutCPlus.Avalonia.slnx
          dotnet build WinNutCPlus.Avalonia.slnx --no-restore -c Release
          dotnet test WinNutCPlus.Core.Tests/WinNutCPlus.Core.Tests.csproj --no-build -c Release

      - name: Publish self-contained win-${{ matrix.arch }}
        working-directory: WinNUT.Avalonia
        run: >
          dotnet publish src/WinNutCPlus.App/WinNutCPlus.App.csproj
          -c Release -r win-${{ matrix.arch }} --self-contained true
          -p:PublishSingleFile=false
          -p:Version=${{ steps.get-ver.outputs.VER }}
          -o publish/win-${{ matrix.arch }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        working-directory: WinNUT.Avalonia/installer
        run: >
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DMyAppVersion=${{ steps.get-ver.outputs.VER }}
          /DMyAppArch=${{ matrix.arch }}
          winnutcplus.iss
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinNutCPlus-Setup-${{ steps.get-ver.outputs.VER }}-${{ matrix.arch }}
          path: WinNUT.Avalonia/installer/Output/WinNutCPlus-Setup-${{ steps.get-ver.outputs.VER }}-${{ matrix.arch }}.exe
          if-no-files-found: error

      - name: Attach installer to the release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            WinNUT.Avalonia/installer/Output/WinNutCPlus-Setup-${{ steps.get-ver.outputs.VER }}-${{ matrix.arch }}.exe
