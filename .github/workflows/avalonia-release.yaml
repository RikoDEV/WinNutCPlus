# Build and package (Inno Setup) the WinNutCPlus installer on a version tag push. Does not
# create or publish a GitHub release — that's done manually, attaching the installer produced
# here as the release asset. WinNUT.Core.Update.UpdateChecker looks for a GitHub release asset
# whose name ends in ".exe", so attach the .exe itself (not the zipped artifact download).

name: avalonia-release

on:
  push:
    tags: "v*"

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get-ver
        run: ../.github/workflows/get-ver.ps1 ${{ github.ref }}
        working-directory: WinNUT.Avalonia
        shell: pwsh

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore, build, test
        working-directory: WinNUT.Avalonia
        run: |
          dotnet restore WinNUT.Avalonia.slnx
          dotnet build WinNUT.Avalonia.slnx --no-restore -c Release
          dotnet test WinNUT.Core.Tests/WinNUT.Core.Tests.csproj --no-build -c Release

      - name: Publish self-contained win-x64
        working-directory: WinNUT.Avalonia
        run: >
          dotnet publish src/WinNUT.App/WinNUT.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -p:Version=${{ steps.get-ver.outputs.VER }}
          -o publish/win-x64

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        working-directory: WinNUT.Avalonia/installer
        run: >
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DMyAppVersion=${{ steps.get-ver.outputs.VER }}
          winnut.iss
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinNutCPlus-Setup-${{ steps.get-ver.outputs.VER }}
          path: WinNUT.Avalonia/installer/Output/WinNUT-Setup-${{ steps.get-ver.outputs.VER }}.exe
          if-no-files-found: error
