# Build and package (Inno Setup) the WinNutCPlus installer on a version tag push, then attach it
# to the GitHub release for that tag. Tag and release creation/editing (title, notes,
# draft/prerelease status) stay manual — this only uploads the .exe as a release asset,
# creating a draft release if one doesn't already exist for the tag, without touching notes.
# WinNUT.Core.Update.UpdateChecker looks for a release asset whose name ends in ".exe".

name: avalonia-release

on:
  push:
    tags: "v*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get-ver
        run: ../.github/workflows/get-ver.ps1 ${{ github.ref }}
        working-directory: WinNUT.Avalonia
        shell: pwsh

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore, build, test
        working-directory: WinNUT.Avalonia
        run: |
          dotnet restore WinNUT.Avalonia.slnx
          dotnet build WinNUT.Avalonia.slnx --no-restore -c Release
          dotnet test WinNUT.Core.Tests/WinNUT.Core.Tests.csproj --no-build -c Release

      - name: Publish self-contained win-x64
        working-directory: WinNUT.Avalonia
        run: >
          dotnet publish src/WinNUT.App/WinNUT.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -p:Version=${{ steps.get-ver.outputs.VER }}
          -o publish/win-x64

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        working-directory: WinNUT.Avalonia/installer
        run: >
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DMyAppVersion=${{ steps.get-ver.outputs.VER }}
          winnut.iss
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinNutCPlus-Setup-${{ steps.get-ver.outputs.VER }}
          path: WinNUT.Avalonia/installer/Output/WinNUT-Setup-${{ steps.get-ver.outputs.VER }}.exe
          if-no-files-found: error

      - name: Attach installer to the release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            WinNUT.Avalonia/installer/Output/WinNUT-Setup-${{ steps.get-ver.outputs.VER }}.exe
